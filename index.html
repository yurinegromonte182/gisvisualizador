<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Visualizador de Shapefile com Camadas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"/>
<style>
  body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
  #toolbar {
    padding: 8px;
    background: #f8f8f8;
    border-bottom: 1px solid #ccc;
  }
  #map {
    height: calc(100vh - 120px);
    width: 100%;
  }
  #attribute-table {
    display: none;
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 40vh;
    overflow: auto;
    background: #fff;
    border-top: 1px solid #ccc;
    z-index: 999;
  }
  #attribute-table table {
    border-collapse: collapse;
    width: 100%;
  }
  #attribute-table th, #attribute-table td {
    border: 1px solid #ddd;
    padding: 4px;
    font-size: 12px;
    text-align: left;
  }
  #attribute-table th {
    background: #f0f0f0;
  }
</style>
</head>
<body>
  <div id="toolbar">
    <input type="file" id="shapefile-input" accept=".zip" />
    <button id="toggle-table">Mostrar Tabela de Atributos</button>
  </div>
  <div id="map"></div>
  <div id="attribute-table"></div>

  <!-- Bibliotecas -->
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://unpkg.com/shapefile@0.6.6"></script>
  <script src="https://unpkg.com/jszip@3.7.1/dist/jszip.min.js"></script>
  <script>
    // Inicialização do mapa com um centro padrão
    var map = L.map('map').setView([0, 0], 2);

    // Camadas base
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© Contribuidores do OpenStreetMap'
    }).addTo(map);

    var osmHOT = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© Contribuidores do OpenStreetMap | Tiles estilo HOT'
    });

    // Objeto de camadas base e de sobreposição (overlays)
    var baseLayers = {
      "OpenStreetMap": osm,
      "OpenStreetMap HOT": osmHOT
    };

    var overlays = {};

    // Controle de camadas (camadas base e sobreposições)
    var layersControl = L.control.layers(baseLayers, overlays).addTo(map);

    var shapefileLayer;        // Layer atual do shapefile
    var attributeData = [];    // Armazena dados de atributos
    var tableVisible = false;  // Controle de visibilidade da tabela

    // Manipulador de input de shapefile
    document.getElementById('shapefile-input').addEventListener('change', function(evt) {
      var file = evt.target.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = function(e) {
        JSZip.loadAsync(e.target.result).then(function(zip) {
          var shpPromise, dbfPromise;
          zip.forEach(function (relativePath, zipEntry) {
            if (relativePath.endsWith('.shp')) {
              shpPromise = zipEntry.async('arraybuffer');
            } else if (relativePath.endsWith('.dbf')) {
              dbfPromise = zipEntry.async('arraybuffer');
            }
          });
          return Promise.all([shpPromise, dbfPromise]);
        }).then(function(results) {
          var shpArrayBuffer = results[0];
          var dbfArrayBuffer = results[1];
          // Abre o shapefile
          shapefile.open(shpArrayBuffer, dbfArrayBuffer).then(function(source) {
            // Remove camada existente, se houver
            if (shapefileLayer) {
              map.removeLayer(shapefileLayer);
              layersControl.removeLayer(shapefileLayer);
            }
            attributeData = [];
            var geojsonFeatureCollection = {
              type: "FeatureCollection",
              features: []
            };
            return source.read().then(function log(result) {
              if (result.done) {
                // Cria camada GeoJSON com o shapefile
                shapefileLayer = L.geoJSON(geojsonFeatureCollection, {
                  onEachFeature: function(feature, layer) {
                    // Popup exibindo os atributos ao clicar
                    layer.on('click', function() {
                      var popupContent = '';
                      Object.keys(feature.properties).forEach(function(key) {
                        popupContent += '<strong>' + key + '</strong>: ' + feature.properties[key] + '<br>';
                      });
                      layer.bindPopup(popupContent).openPopup();
                    });
                  },
                  style: function(feature) {
                    return { color: 'blue', weight: 2, fillOpacity: 0.4 };
                  }
                }).addTo(map);

                // Adiciona a camada ao controle de camadas
                overlays[file.name] = shapefileLayer;
                layersControl.addOverlay(shapefileLayer, file.name);

                // Ajusta a visualização para abranger a camada
                map.fitBounds(shapefileLayer.getBounds());

                // Constroi a tabela de atributos
                buildAttributeTable();
                return;
              }
              // Coleta feature e seus atributos
              geojsonFeatureCollection.features.push(result.value);
              attributeData.push(result.value.properties);
              return source.read().then(log);
            });
          });
        });
      };
      reader.readAsArrayBuffer(file);
    });

    // Constroi a tabela de atributos
    function buildAttributeTable() {
      var container = document.getElementById('attribute-table');
      container.innerHTML = '';
      if (attributeData.length === 0) return;

      // Determina todas as colunas únicas
      var columns = new Set();
      attributeData.forEach(function(attrs) {
        Object.keys(attrs).forEach(function(key) {
          columns.add(key);
        });
      });
      var colArray = Array.from(columns);

      // Cria a tabela
      var table = document.createElement('table');
      var thead = document.createElement('thead');
      var headRow = document.createElement('tr');
      colArray.forEach(function(col) {
        var th = document.createElement('th');
        th.textContent = col;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);

      var tbody = document.createElement('tbody');
      attributeData.forEach(function(attrs) {
        var tr = document.createElement('tr');
        colArray.forEach(function(col) {
          var td = document.createElement('td');
          td.textContent = attrs[col] !== undefined ? attrs[col] : '';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      container.appendChild(table);
    }

    // Botão para mostrar/ocultar a tabela de atributos
    document.getElementById('toggle-table').addEventListener('click', function() {
      var container = document.getElementById('attribute-table');
      tableVisible = !tableVisible;
      if (tableVisible) {
        container.style.display = 'block';
        this.textContent = 'Ocultar Tabela de Atributos';
      } else {
        container.style.display = 'none';
        this.textContent = 'Mostrar Tabela de Atributos';
      }
    });
  </script>
</body>
</html>
